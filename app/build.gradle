plugins { id 'com.android.application' }
android {
  namespace 'vn.sodienson'
  compileSdk 34
  defaultConfig { applicationId "vn.sodienson"; minSdk 26; targetSdk 34; versionCode 11; versionName "1.8" }
  signingConfigs { sds { storeFile file('sds.keystore'); storePassword 'sodienson'; keyAlias 'sds'; keyPassword 'sodienson' } }
  buildTypes {
    debug { signingConfig signingConfigs.sds }
    release { minifyEnabled false; signingConfig signingConfigs.sds }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'com.google.android.gms:play-services-auth:21.2.0'
  implementation 'androidx.core:core:1.13.1'
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
